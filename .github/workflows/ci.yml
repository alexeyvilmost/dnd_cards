name: Local contract suites

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Local suite; legacy diagnostics require an explicit ID'
        type: choice
        options: [core, extended, legacy-manual]
        default: core
      legacy_suite:
        description: 'ID from tests/suites.json (only for legacy-manual)'
        type: string

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      suite: ${{ steps.policy.outputs.suite }}
      shards: ${{ steps.policy.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: policy
        name: Select the exact mandatory workload
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          REQUESTED_SUITE: ${{ inputs.suite || 'core' }}
          LEGACY_SUITE: ${{ inputs.legacy_suite || '' }}
        run: node scripts/testing/ci-policy.mjs >> "$GITHUB_OUTPUT"
  contracts:
    needs: plan
    strategy:
      fail-fast: false
      # Each lane owns PG, worker and UI outputs. Bound memory/CPU concurrency.
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: PostgreSQL 17 binaries for the owned native cluster
        # Official PGDG repository. The runner creates its own random cluster,
        # role, database and marker; no shared service database is passed in.
        run: |
          if [ ! -x /usr/lib/postgresql/17/bin/initdb ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/dnd-test-pgdg.list
            sudo apt-get update
            sudo apt-get install --yes postgresql-17
          fi
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Run the shared suite runner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          REQUESTED_SUITE: ${{ needs.plan.outputs.suite }}
          LEGACY_SUITE: ${{ inputs.legacy_suite || '' }}
          SHARD: ${{ matrix.shard }}
          TEST_PG_BIN: /usr/lib/postgresql/17/bin
        run: |
          args=(--mode ci --candidate HEAD --suite "$REQUESTED_SUITE" --output outputs/testing/ci)
          if [ -n "$BASE_SHA" ]; then args+=(--base "$BASE_SHA"); fi
          if [ -n "$LEGACY_SUITE" ]; then args+=(--select "$LEGACY_SUITE"); fi
          if [ "$REQUESTED_SUITE" = extended ]; then args+=(--race); fi
          if [ "$REQUESTED_SUITE" != legacy-manual ]; then args+=(--shard "$SHARD"); fi
          node scripts/testing/run.mjs "${args[@]}"
      - name: Publish verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.suite == 'legacy-manual' && 'local-suite-results' || format('local-suite-{0}', matrix.shard) }}
          # Do not upload run directories: they may contain transient DB data.
          path: |
            outputs/testing/ci/report.json
            outputs/testing/ci/test-catalog.json
            outputs/testing/ci/source-snapshot.json
          if-no-files-found: error
  aggregate:
    needs: [plan, contracts]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.suite != 'legacy-manual'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every shard to finish successfully
        env:
          SHARD_RESULT: ${{ needs.contracts.result }}
        run: test "$SHARD_RESULT" = success
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: local-suite-*
          path: outputs/testing/shards
      - name: Verify global coverage and exact source, then combine receipts
        run: |
          mapfile -t reports < <(find outputs/testing/shards -name report.json -type f | sort)
          node scripts/testing/aggregate-shards.mjs outputs/testing/ci "${reports[@]}"
      - name: Publish the complete release-eligible report
        uses: actions/upload-artifact@v4
        with:
          name: local-suite-results
          path: |
            outputs/testing/ci/report.json
            outputs/testing/ci/test-catalog.json
            outputs/testing/ci/source-snapshot.json
          if-no-files-found: error
