name: Deploy validated immutable composition
run-name: ${{ inputs.retirement_operation_id && format('Record retirement {0}', inputs.retirement_operation_id) || github.workflow }}

# Prepared only. Both tracked policy and repository variables default disabled.
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: 'Successful release.yml run containing verified immutable candidate images'
        required: false
        type: string
      retirement_operation_id:
        description: 'Record an already succeeded retirement302 operation; does not execute SQL or replace applications'
        required: false
        type: string
      adopt_legacy:
        description: 'First transition from the separately inspected legacy deployment; requires exact backup and rollback rehearsal'
        required: false
        type: boolean
        default: false
  workflow_run:
    workflows: ['Prepare immutable release images']
    branches: [main]
    types: [completed]

permissions:
  contents: read

# Never cancel an active migration/cutover because a newer push arrives.
concurrency:
  group: production-composition
  cancel-in-progress: false

jobs:
  prepare:
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && vars.AUTO_DEPLOY_MAIN_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.candidate.outputs.source_sha || steps.record.outputs.source_sha }}
      deployment_mode: ${{ steps.identity.outputs.deployment_mode }}
      candidate_available: ${{ steps.freshness.outputs.candidate_available || steps.record.outputs.candidate_available }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - id: identity
        env:
          DEPLOY_EVENT: ${{ github.event_name }}
          ADOPT_LEGACY: ${{ inputs.adopt_legacy && 'true' || 'false' }}
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          DEPLOY_SHA: ${{ github.sha }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          RELEASE_RUN: ${{ inputs.release_run_id || github.event.workflow_run.id }}
          RETIREMENT_OPERATION_ID: ${{ inputs.retirement_operation_id || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node control/scripts/release/deployment-handoff.mjs policy control/infra/deployment-policy.json
          if [ -n "$RETIREMENT_OPERATION_ID" ]; then
            test "$DEPLOY_EVENT" = workflow_dispatch
            test "$ADOPT_LEGACY" = false
            test -z "$RELEASE_RUN"
            echo 'deployment_mode=record-retirement' >> "$GITHUB_OUTPUT"
            echo 'candidate_available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deployment_mode=$(node control/scripts/release/deployment-handoff.mjs mode)" >> "$GITHUB_OUTPUT"
          node control/scripts/release/release-publication.mjs "$RELEASE_RUN" "$GITHUB_REPOSITORY" verified-release-run.json >> "$GITHUB_OUTPUT"
      - if: steps.identity.outputs.candidate_available == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.identity.outputs.artifact_id }}
          path: candidate
          merge-multiple: true
          run-id: ${{ inputs.release_run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: candidate
        if: steps.identity.outputs.candidate_available == 'true'
        name: Verify application source separately from the release workflow commit
        run: |
          source_sha=$(node control/scripts/release/deployment-handoff.mjs candidate candidate verified-release-run.json)
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          cp verified-release-run.json candidate/verified-release-run.json
      - id: latest
        if: steps.identity.outputs.candidate_available == 'true' || steps.identity.outputs.deployment_mode == 'record-retirement'
        name: Re-read latest actual deployment before scheduling the host job
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node control/scripts/release/convergence-cli.mjs discover latest-deployment.json >> "$GITHUB_OUTPUT"
      - if: (steps.identity.outputs.candidate_available == 'true' || steps.identity.outputs.deployment_mode == 'record-retirement') && steps.latest.outputs.artifact_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.latest.outputs.artifact_id }}
          run-id: ${{ steps.latest.outputs.run_id }}
          path: current-baseline
          merge-multiple: true
          github-token: ${{ github.token }}
      - id: record
        if: steps.identity.outputs.deployment_mode == 'record-retirement'
        name: Bind manual record to the latest actual application manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          ADOPT_LEGACY: ${{ inputs.adopt_legacy && 'true' || 'false' }}
          RETIREMENT_OPERATION_ID: ${{ inputs.retirement_operation_id }}
        run: node control/scripts/release/retirement-record-ci.mjs "$RETIREMENT_OPERATION_ID" current-baseline latest-deployment.json record-request.json >> "$GITHUB_OUTPUT"
      - if: steps.record.outputs.candidate_available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-retirement-input
          path: record-request.json
          if-no-files-found: error
          retention-days: 7
      - id: freshness
        if: steps.identity.outputs.candidate_available == 'true'
        name: Skip superseded automatic candidates without attempting a cutover
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node control/scripts/release/convergence-cli.mjs preflight candidate verified-release-run.json latest-deployment.json current-baseline preflight.json >> "$GITHUB_OUTPUT"
      - if: steps.freshness.outputs.candidate_available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-deployment-input
          path: candidate/
          if-no-files-found: error
          retention-days: 7
      - if: always() && steps.identity.outputs.candidate_available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-preflight
          path: preflight.json
          if-no-files-found: ignore
          retention-days: 90

  deploy:
    needs: prepare
    if: needs.prepare.outputs.candidate_available == 'true'
    environment: production
    # Public repository: no production-capable self-hosted Actions runner.
    # Dedicated SSH credentials belong to the main-only production environment.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.prepare.outputs.deployment_mode != 'record-retirement'
        with:
          name: validated-deployment-input
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.prepare.outputs.deployment_mode == 'record-retirement'
        with:
          name: validated-retirement-input
          path: retirement-input
      - name: Transfer exact control and candidate; run verified host gates over SSH
        if: needs.prepare.outputs.deployment_mode != 'record-retirement'
        env:
          DEPLOY_MODE: ${{ needs.prepare.outputs.deployment_mode }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          DEPLOY_HOST_CONFIG_FILE: ${{ vars.DEPLOY_HOST_CONFIG_FILE }}
          REHEARSAL_CONFIG_FILE: ${{ vars.REHEARSAL_CONFIG_FILE }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_ATTEMPT_ROOT: ${{ vars.DEPLOY_SSH_ATTEMPT_ROOT }}
          DEPLOY_SSH_NODE: ${{ vars.DEPLOY_SSH_NODE }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: node control/scripts/release/ssh-deploy.mjs control candidate deployed-release
      - name: Record the existing succeeded retirement over authenticated SSH
        if: needs.prepare.outputs.deployment_mode == 'record-retirement'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          DEPLOY_HOST_CONFIG_FILE: ${{ vars.DEPLOY_HOST_CONFIG_FILE }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_ATTEMPT_ROOT: ${{ vars.DEPLOY_SSH_ATTEMPT_ROOT }}
          DEPLOY_SSH_NODE: ${{ vars.DEPLOY_SSH_NODE }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: node control/scripts/release/ssh-retirement-record.mjs control retirement-input/record-request.json deployed-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployed-release
          path: deployed-release/
          if-no-files-found: error
          retention-days: 90
      - name: Publish optional safe frontend proof projection separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-proof-anchor
          path: deployed-release/frontend-proof-anchor.json
          if-no-files-found: ignore
          retention-days: 90
