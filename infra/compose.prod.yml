name: bagofholding

services:
  backend:
    depends_on:
      rules-worker:
        condition: service_healthy
    image: ${BACKEND_IMAGE:?Validated manifest BACKEND_IMAGE digest is required}
    env_file:
      - ${APP_ENV_FILE:-/opt/bagofholding/shared/app.env}
      - ${WORKER_ENV_FILE:-/opt/bagofholding/shared/rules-worker.env}
    environment:
      PORT: "8080"
      RELEASE_COMMIT: ${BACKEND_RELEASE_COMMIT:-${RELEASE_COMMIT:?Validated launch identity is required}}
      RELEASE_ID: ${BACKEND_RELEASE_ID:-${RELEASE_ID:?Validated launch identity is required}}
      RULES_WORKER_URL: http://rules-worker:8090
      RULES_WORKER_MAX_INFLIGHT: ${RULES_WORKER_MAX_INFLIGHT:-4}
      RULES_COMBAT_ASYNC_PERSIST_ENABLED: "1"
      RULES_PERFORMANCE_ENABLED: "1"
      RULES_INITIATIVE_OPTIONS_ENABLED: "1"
      # Prepare with the canonical engine before taking character write locks.
      RULES_EQUIPMENT_INTENT_ENABLED: "1"
      TRUSTED_PROXY_CIDRS: 172.20.0.0/24
      # Expansion rollout must keep old readers compatible until a separately
      # reviewed writer-enable release changes this explicit policy.
      DB_COMPACT_RECEIPTS: ${DB_COMPACT_RECEIPTS:?validated writer policy required}
      DB_FROZEN_CATALOGS: "0"
      IMAGE_JOBS_ENABLED: ${IMAGE_JOBS_ENABLED:?validated writer policy required}
    restart: unless-stopped
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - edge

  rules-worker:
    image: ${RULES_WORKER_IMAGE:?Validated manifest RULES_WORKER_IMAGE digest is required}
    env_file:
      - ${WORKER_ENV_FILE:-/opt/bagofholding/shared/rules-worker.env}
    environment:
      RELEASE_COMMIT: ${RULES_WORKER_RELEASE_COMMIT:-${RELEASE_COMMIT:?Validated launch identity is required}}
      RELEASE_ID: ${RULES_WORKER_RELEASE_ID:-${RELEASE_ID:?Validated launch identity is required}}
      PORT: "8090"
      RULES_WORKER_MAX_CACHED_ARTIFACTS: ${RULES_WORKER_MAX_CACHED_ARTIFACTS:-4}
      RULES_PERFORMANCE_ENABLED: "1"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ${RULES_ARTIFACTS_DIRECTORY:-/opt/bagofholding/shared/rules-artifacts}:/artifacts
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - edge

  frontend:
    volumes:
      - ${FRONTEND_ASSETS_DIRECTORY:-/opt/bagofholding/shared/frontend-assets}:/var/lib/bagofholding/frontend:ro
    image: ${FRONTEND_IMAGE:?Validated manifest FRONTEND_IMAGE digest is required}
    environment:
      PORT: "3000"
      RELEASE_COMMIT: ${FRONTEND_RELEASE_COMMIT:-${RELEASE_COMMIT:?Validated launch identity is required}}
      RELEASE_ID: ${FRONTEND_RELEASE_ID:-${RELEASE_ID:?Validated launch identity is required}}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - edge

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - edge

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  caddy_data:
  caddy_config:
