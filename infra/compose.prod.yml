name: bagofholding

services:
  backend:
    image: bagofholding-backend:${SOURCE_COMMIT:?SOURCE_COMMIT is required}
    env_file:
      - ${APP_ENV_FILE:-/opt/bagofholding/shared/app.env}
    environment:
      PORT: "8080"
      SOURCE_COMMIT: ${SOURCE_COMMIT}
      TRUSTED_PROXY_CIDRS: 172.20.0.0/24
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - edge

  frontend:
    image: bagofholding-frontend:${SOURCE_COMMIT:?SOURCE_COMMIT is required}
    environment:
      PORT: "3000"
      SOURCE_COMMIT: ${SOURCE_COMMIT}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - edge

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - edge

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  caddy_data:
  caddy_config:
